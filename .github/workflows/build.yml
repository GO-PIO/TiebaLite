# .github/workflows/build-android.yml
name: Build Android APK

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  
  # 推送到主分支时自动构建
  push:
    branches: [ main, master, 'release/**' ]
    tags: [ 'v*' ]
  
  # PR 时构建（不签名）
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # 1. 检出代码
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      # 3. 缓存 Gradle（加速后续构建）
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. 解码签名文件（仅非 PR 且非 debug 构建）
      - name: Decode Keystore
        if: github.event_name != 'pull_request' && inputs.build_type != 'debug'
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: ${{ vars.RELEASE_KEYSTORE || 'release.keystore' }}
          fileDir: ${{ github.workspace }}
          encodedString: ${{ secrets.KEYSTORE }}

      # 5. 生成签名配置
      - name: Generate keystore.properties
        if: github.event_name != 'pull_request' && inputs.build_type != 'debug'
        run: |
          if [ -n "${{ secrets.RELEASEKEYPASSWORD }}" ]; then
            echo "keystore.file=${{ vars.RELEASE_KEYSTORE || 'release.keystore' }}" > keystore.properties
            echo "keystore.password=${{ secrets.RELEASESTOREPASSWORD }}" >> keystore.properties
            echo "keystore.key.alias=${{ vars.RELEASE_KEY_ALIAS || 'release' }}" >> keystore.properties
            echo "keystore.key.password=${{ secrets.RELEASEKEYPASSWORD }}" >> keystore.properties
            echo "✅ 签名配置已生成"
          else
            echo "⚠️ 未找到签名密码，将构建未签名 APK"
          fi

      # 6. 设置 Gradle 并构建
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # 7. 构建 APK
      - name: Build APK
        run: |
          if [ "${{ inputs.build_type }}" == "debug" ] || [ "${{ github.event_name }}" == "pull_request" ]; then
            ./gradlew assembleDebug
            echo "BUILD_TYPE=debug" >> $GITHUB_ENV
          else
            ./gradlew assembleRelease
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
          fi

      # 8. 读取构建输出信息
      - name: Read Output Metadata
        id: read_metadata
        run: |
          METADATA_PATH="./app/build/outputs/apk/${{ env.BUILD_TYPE }}/output-metadata.json"
          if [ -f "$METADATA_PATH" ]; then
            VERSION_CODE=$(jq -r '.elements[0].versionCode' "$METADATA_PATH")
            VERSION_NAME=$(jq -r '.elements[0].versionName' "$METADATA_PATH")
            echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
            echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
            echo "📱 版本: $VERSION_NAME ($VERSION_CODE)"
          else
            echo "version_code=unknown" >> $GITHUB_OUTPUT
            echo "version_name=unknown" >> $GITHUB_OUTPUT
          fi

      # 9. 上传 APK 产物
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "apk-${{ steps.read_metadata.outputs.version_name }}(${{ steps.read_metadata.outputs.version_code }})"
          path: ./app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          retention-days: 30

      # 10. 上传 Mapping 文件（Release 构建）
      - name: Upload Mapping Artifact
        if: env.BUILD_TYPE == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.read_metadata.outputs.version_name }}
          path: ./app/build/outputs/mapping/release/
          retention-days: 30

      # 11. 上传到 App Center（可选）
      - name: Upload to App Center
        if: env.BUILD_TYPE == 'release' && secrets.APP_CENTER_TOKEN != ''
        env:
          APPCENTER_TOKEN: ${{ secrets.APP_CENTER_TOKEN }}
          APPCENTER_APP: ${{ secrets.APP_CENTER_APP }}
          VERSION_CODE: ${{ steps.read_metadata.outputs.version_code }}
          VERSION_NAME: ${{ steps.read_metadata.outputs.version_name }}
        run: |
          npm install -g appcenter-cli
          appcenter login --token "$APPCENTER_TOKEN"
          
          # 上传 Mapping 文件
          if [ -f "./app/build/outputs/mapping/release/mapping.txt" ]; then
            echo "📤 上传 Mapping 文件到 App Center..."
            appcenter crashes upload-mappings \
              -c "$VERSION_CODE" \
              -n "$VERSION_NAME" \
              -m ./app/build/outputs/mapping/release/mapping.txt \
              -a "$APPCENTER_APP" || echo "⚠️ Mapping 上传失败"
          fi
          
          # 分发 APK 到测试组（可选）
          if [ "${{ inputs.distribute }}" == "true" ]; then
            echo "📤 分发 APK 到测试组..."
            appcenter distribute release \
              --app "$APPCENTER_APP" \
              --file "./app/build/outputs/apk/release/app-release.apk" \
              --group "Collaborators" \
              --release-notes "Build: ${{ github.run_number }}" \
              --build-version "$VERSION_NAME" \
              --build-number "$VERSION_CODE" || echo "⚠️ 分发失败"
          fi

      # 12. 发送 Telegram 通知（可选）
      - name: Notify Telegram
        if: github.event_name != 'pull_request' && contains(github.event.head_commit.message, '[skip notify]') == false
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION_NAME: ${{ steps.read_metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.read_metadata.outputs.version_code }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "⏭️ 未配置 Telegram，跳过通知"
            exit 0
          fi
          
          APK_PATH=$(find ./app/build/outputs/apk/${{ env.BUILD_TYPE }} -name "*.apk" | head -n 1)
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          BRANCH="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # 转义 Markdown 特殊字符
          ESCAPED_MSG=$(echo "$COMMIT_MSG" | sed 's/[_*[\]()~`>#+=|{}.!-]/\\&/g')
          
          CAPTION="📦 *Android Build Completed*
          
          *版本:* \`$VERSION_NAME\` (\`$VERSION_CODE\`)
          *分支:* \`$BRANCH\`
          *类型:* ${{ env.BUILD_TYPE }}
          
          *提交信息:*
          \`\`\`
          $ESCAPED_MSG
          \`\`\`
          
          [查看构建详情]($RUN_URL)"
          
          # 发送文档（APK）
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendDocument" \
            -F chat_id="$CHAT_ID" \
            -F document=@"$APK_PATH" \
            -F caption="$CAPTION" \
            -F parse_mode="MarkdownV2" \
            -F reply_markup='{"inline_keyboard":[[{"text":"🔗 在 GitHub 查看","url":"'"$RUN_URL"'"}]]}' || echo "⚠️ 通知发送失败"

      # 13. 创建 GitHub Release（仅 tag 推送）
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ./app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
